<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orlendo | Compare Your Loan Options Stress-Free</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-zinc-900 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Centered Lead Gen Card -->
    <div class="w-full max-w-md p-8 border border-zinc-200 rounded-2xl shadow-xl bg-white relative">
        <div class="flex items-start justify-between mb-6">
            <div>
                <h2 class="text-xl font-bold tracking-tight text-red-600">Compare Your Loan Options</h2>
                <p class="text-xs text-zinc-500 mt-0.5" id="header-subtitle">Get matched with the nation's top lenders!</p>
            </div>
            <span id="step-indicator" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-red-50 text-red-700 border border-red-200 shrink-0">
                Step 1 of 3
            </span>
        </div>

        <form id="leadForm" novalidate>
            <!-- Hidden Compliance & Attribution Tokens -->
            <input type="hidden" name="leadid_token" id="leadid_token" value="MOCK-JORNAYA-TOKEN-12345">
            <input type="hidden" name="trustedform_cert_url" id="trustedform_cert_url" value="https://cert.trustedform.com/mock-cert-67890">

            <!-- Step 1: Loan Purpose & Property Numbers -->
            <div class="step block space-y-4" id="step-1">
                <!-- Purchase & Refinance Segmented Toggle -->
                <div>
                    <label class="block text-sm font-semibold text-zinc-800 mb-1.5">What is your loan goal?</label>
                    <div class="grid grid-cols-2 p-1 bg-zinc-100 rounded-lg border border-zinc-200">
                        <button type="button" id="btn-toggle-purchase" class="py-2 text-xs font-bold rounded-md bg-white text-red-600 shadow-sm transition">
                            Purchase
                        </button>
                        <button type="button" id="btn-toggle-refinance" class="py-2 text-xs font-bold rounded-md text-zinc-600 hover:text-zinc-900 transition">
                            Refinance
                        </button>
                    </div>
                    <input type="hidden" id="loan_purpose" name="loan_purpose" value="purchase">
                </div>

                <!-- Property Value Field (Dynamic Label) -->
                <div>
                    <label id="property_value_label" for="property_value" class="block text-sm font-semibold text-zinc-800 mb-1.5">
                        Estimated Purchase Price ($)
                    </label>
                    <input type="number" id="property_value" name="property_value" value="450000" min="50000" step="5000" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                </div>

                <!-- Purchase-Only: Down Payment -->
                <div id="purchase_fields" class="block">
                    <label for="down_payment" class="block text-sm font-semibold text-zinc-800 mb-1.5">Estimated Down Payment ($)</label>
                    <input type="number" id="down_payment" name="down_payment" value="90000" min="0" step="1000" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                </div>

                <!-- Refinance-Only: Balance & Goal -->
                <div id="refinance_fields" class="hidden space-y-4">
                    <div>
                        <label for="current_balance" class="block text-sm font-semibold text-zinc-800 mb-1.5">Current Mortgage Balance ($)</label>
                        <input type="number" id="current_balance" name="current_balance" value="320000" min="10000" step="5000" disabled class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                    </div>
                    <div>
                        <label for="refi_goal" class="block text-sm font-semibold text-zinc-800 mb-1.5">Primary Refinance Goal</label>
                        <select id="refi_goal" name="refi_goal" disabled class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                            <option value="lower_monthly_payment">Lower Monthly Payment</option>
                            <option value="cash_out_equity">Take Cash Out of Home</option>
                            <option value="shorten_term">Shorten Loan Term</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="btn-step1-next" class="w-full mt-2 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-sm hover:shadow transition active:scale-[0.99]">
                    Continue &rarr;
                </button>
            </div>

            <!-- Step 2: Final Qualification -->
            <div class="step hidden space-y-4" id="step-2">
                <div>
                    <label for="credit_score" class="block text-sm font-semibold text-zinc-800 mb-1.5">Credit Score Tier</label>
                    <select id="credit_score" name="credit_score" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                        <option value="excellent">Excellent (740+)</option>
                        <option value="good">Good (680 - 739)</option>
                        <option value="fair">Fair (620 - 679)</option>
                        <option value="poor">Needs Help (&lt; 620)</option>
                    </select>
                </div>
                <div>
                    <label for="zip_code" class="block text-sm font-semibold text-zinc-800 mb-1.5">Property ZIP Code</label>
                    <input type="text" id="zip_code" name="zip_code" placeholder="78701" pattern="[0-9]{5}" maxlength="5" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                </div>

                <div class="flex gap-2 mt-2">
                    <button type="button" id="btn-step2-back" class="w-1/3 py-3 px-4 border border-zinc-300 text-zinc-700 font-semibold rounded-lg hover:bg-zinc-50 transition">
                        Back
                    </button>
                    <button type="button" id="btn-step2-next" class="w-2/3 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-sm hover:shadow transition active:scale-[0.99]">
                        Next &rarr;
                    </button>
                </div>
            </div>

            <!-- Step 3: Contact & TCPA Consent -->
            <div class="step hidden space-y-4" id="step-3">
                <div>
                    <label for="full_name" class="block text-sm font-semibold text-zinc-800 mb-1.5">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Jane Doe" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                </div>

                <div>
                    <label for="phone" class="block text-sm font-semibold text-zinc-800 mb-1.5">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="(512) 555-0199" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-zinc-800 mb-1.5">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com" required class="w-full px-3.5 py-2.5 border border-zinc-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition">
                </div>

                <label class="flex items-start gap-2.5 text-xs text-zinc-500 leading-relaxed cursor-pointer pt-1">
                    <input type="checkbox" id="tcpa" name="tcpa" required checked class="mt-0.5 h-4 w-4 rounded border-zinc-300 text-red-600 focus:ring-red-600">
                    <span>I consent to receive calls and text messages from up to 4 lending partners regarding rates. Consent is not a condition of purchase.</span>
                </label>

                <div class="flex gap-2 mt-2">
                    <button type="button" id="btn-step3-back" class="w-1/3 py-3 px-4 border border-zinc-300 text-zinc-700 font-semibold rounded-lg hover:bg-zinc-50 transition">
                        Back
                    </button>
                    <button type="submit" class="w-2/3 py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-sm hover:shadow transition active:scale-[0.99]">
                        Submit Lead
                    </button>
                </div>
            </div>
        </form>

        <!-- Success Step (Outside form, clean isolation) -->
        <div class="step hidden" id="step-success">
            <div class="flex items-center gap-2 mb-2">
                <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <h3 class="text-base font-bold text-emerald-600">Lead Dispatched</h3>
            </div>
            <p class="text-xs text-zinc-600 mb-3">Payload formatted for CRM / Webhook</p>
            <pre id="jsonOutput" class="bg-zinc-50 border border-zinc-200 text-zinc-800 p-3.5 rounded-lg text-xs font-mono overflow-x-auto max-h-72"></pre>

            <button type="button" id="btn-reset" class="w-full mt-4 py-2 px-3 border border-zinc-300 text-zinc-700 font-semibold rounded-lg text-sm hover:bg-zinc-50 transition">
                Submit Another Lead
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
